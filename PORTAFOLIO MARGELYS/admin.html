<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="wrap">

    <div id="login-box" class="admin-box">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" />
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" />
      <p id="login-error" class="error" style="display:none;"></p>
      <button class="btn btn-primary" id="login-btn" style="width:100%;">Entrar</button>
    </div>

    <div id="panel" style="display:none;">
      <div class="admin-topbar">
        <span>Panel de proyectos</span>
        <button class="btn btn-secondary" id="logout-btn">Salir</button>
      </div>

      <div class="admin-box" style="margin:24px auto;">
        <label for="p-title">Título</label>
        <input id="p-title" type="text" />

        <label for="p-category">Categoría</label>
        <input id="p-category" type="text" />

        <label for="p-cellref">Referencia de celda (ej. F3)</label>
        <input id="p-cellref" type="text" placeholder="F3" />

        <label for="p-image">Ruta o URL de la imagen (opcional)</label>
        <input id="p-image" type="text" placeholder="assets/img/mi-proyecto.jpg" />
        <p class="field-hint">Sube la imagen a assets/img/ en el repo y escribe la ruta aquí, o pega una URL pública.</p>

        <label for="p-problem">Problema</label>
        <textarea id="p-problem" rows="2"></textarea>

        <label for="p-result">Resultado</label>
        <textarea id="p-result" rows="2"></textarea>

        <label for="p-tags">Habilidades / tags (separados por coma)</label>
        <input id="p-tags" type="text" placeholder="Power Query, VBA, Dashboards" />
        <p class="field-hint">Usa los mismos nombres que ya existen (Excel Avanzado, VBA, Power Query…) para que el gráfico de habilidades agrupe bien.</p>

        <label><input id="p-featured" type="checkbox" style="width:auto; display:inline-block;" /> Destacado</label>
        <p id="form-error" class="error" style="display:none;"></p>
        <button class="btn btn-primary" id="save-btn" style="width:100%; margin-top:8px;">Agregar proyecto</button>
      </div>

      <div class="admin-box" style="margin:24px auto;">
        <div id="project-list"></div>
      </div>
    </div>

  </div>

  <script src="assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
