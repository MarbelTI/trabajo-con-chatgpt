<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual de KPIs y Dashboards por Área</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3FB; --surface:#FFFFFF; --surface-2:#EEEBFA; --border:rgba(20,16,59,0.12);
    --text:#14103B; --text-2:rgba(20,16,59,0.62); --text-3:rgba(20,16,59,0.45);
    --accent:#6A5AC4; --accent-dark:#4A3F94; --gold:#C9A24B; --gold-dark:#8A6A1F;
    --red:#C0453D; --red-bg:rgba(192,69,61,0.08); --red-border:rgba(192,69,61,0.3);
    --orange:#B9791E; --orange-bg:rgba(185,121,30,0.08); --orange-border:rgba(185,121,30,0.3);
    --green:#2F8F5B; --green-bg:rgba(47,143,91,0.08); --green-border:rgba(47,143,91,0.3);
    --blue:#2E6E92; --purple2:#5B4FA8;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1100px 700px at 100% -10%, rgba(106,90,196,0.10), transparent 60%), var(--bg);
    color:var(--text); font-family:var(--font-body); min-height:100vh;
  }
  .app{display:grid; grid-template-columns:300px 1fr; min-height:100vh;}
  .sidebar{background:var(--surface-2); border-right:1px solid var(--border);
    padding:28px 20px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .sidebar h1{font-family:var(--font-display); font-size:1.05rem; letter-spacing:0.02em; margin:0 0 4px; line-height:1.3; color:var(--accent-dark);}
  .sidebar .subtitle{font-size:0.76rem; color:var(--text-2); margin:0 0 20px; line-height:1.5;}
  .search input{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:9px 12px; font-family:var(--font-body); font-size:0.83rem;}
  .search input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .search input::placeholder{color:var(--text-3);}
  .progress-wrap{margin:18px 0 20px;}
  .progress-label{font-size:0.7rem; color:var(--text-2); display:flex; justify-content:space-between; margin-bottom:6px;}
  .progress-bar{height:5px; background:rgba(20,16,59,0.08); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--accent));}
  .tab-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .tab-item{display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; cursor:pointer; font-size:0.83rem; border-left:2px solid transparent;}
  .tab-item .n{font-family:var(--font-mono); font-size:0.68rem; color:var(--text-3); width:16px; flex-shrink:0;}
  .tab-item .name{line-height:1.3;}
  .tab-item.pending{opacity:0.55;}
  .tab-item.active{background:rgba(106,90,196,0.14); border-left-color:var(--gold); font-weight:600;}
  .tab-item:not(.pending):hover{background:rgba(20,16,59,0.05);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green); flex-shrink:0;}
  .tab-item.pending .dot{background:rgba(20,16,59,0.18);}
  .sidebar-footer{margin-top:22px; padding-top:16px; border-top:1px solid var(--border); font-size:0.7rem; color:var(--text-3); line-height:1.6;}

  .main{padding:52px 64px; max-width:1000px;}
  .area-eyebrow{font-family:var(--font-mono); color:var(--gold-dark); font-size:0.78rem; letter-spacing:0.12em;}
  .area-title{font-family:var(--font-display); font-size:2.05rem; margin:6px 0 14px; line-height:1.2; color:var(--text);}
  .area-mission{font-size:1rem; color:var(--text-2); max-width:72ch; line-height:1.65; margin-bottom:22px;}
  .toolbar{display:flex; gap:10px; margin-bottom:26px;}
  .toolbar button{background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 14px;
    border-radius:20px; font-size:0.78rem; cursor:pointer; font-family:var(--font-body);}
  .toolbar button:hover{border-color:var(--gold); color:var(--gold-dark);}

  .section{border:1px solid var(--border); border-radius:12px; margin-bottom:14px; background:var(--surface); overflow:hidden;
    box-shadow:0 1px 3px rgba(20,16,59,0.04);}
  .section summary{list-style:none; cursor:pointer; padding:16px 20px; display:flex; align-items:center; gap:14px;
    font-family:var(--font-display); font-size:1rem; user-select:none; color:var(--text);}
  .section summary::-webkit-details-marker{display:none;}
  .section summary::after{content:'+'; margin-left:auto; color:var(--gold); font-size:1.2rem;}
  .section[open] summary::after{content:'–';}
  .sec-letter{width:30px;height:30px;border-radius:8px;background:rgba(201,162,75,0.16); color:var(--gold-dark);
    display:flex; align-items:center; justify-content:center; font-size:0.85rem; flex-shrink:0;}
  .sec-body{padding:0 20px 22px 64px;}

  .clean-list,.q-list{margin:0; padding-left:20px; line-height:1.85; font-size:0.9rem;}
  .q-list{color:var(--text-2);}

  .kpi-grid-wrap{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px;}
  .kpi-card{--kc:#C9A24B; --kct:#8A6A1F; border:1px solid var(--border); border-top:3px solid var(--kc); border-radius:10px;
    padding:16px; background:var(--surface);}
  .kpi-card__head{display:flex; flex-direction:column; gap:4px; margin-bottom:8px;}
  .kpi-tag{font-family:var(--font-mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--kct);}
  .kpi-card h4{margin:0; font-family:var(--font-display); font-size:1.02rem; color:var(--text);}
  .kpi-card__def{font-size:0.85rem; color:var(--text-2); margin:0 0 12px; line-height:1.5;}
  .kpi-meta-row{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:10px;}
  .kpi-meta{background:rgba(20,16,59,0.045); border-radius:6px; padding:6px 8px;}
  .kpi-meta span{display:block; font-size:0.62rem; color:var(--text-3); text-transform:uppercase; letter-spacing:0.04em;}
  .kpi-meta strong{font-size:0.8rem; font-weight:600; color:var(--text);}
  .kpi-formula{background:rgba(20,16,59,0.05); border-radius:6px; padding:8px 10px; margin-bottom:10px; font-size:0.8rem;}
  .kpi-formula span{display:block; font-size:0.62rem; color:var(--gold-dark); margin-bottom:3px; text-transform:uppercase;}
  .kpi-formula code{font-family:var(--font-mono); color:var(--text);}
  .kpi-interp{font-size:0.82rem; line-height:1.55; margin-bottom:10px; color:var(--text);}
  .kpi-interp span{color:var(--gold-dark); font-weight:600;}
  .kpi-updown{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
  .kpi-updown .up span,.kpi-updown .down span{font-size:0.66rem; font-weight:700; display:block; margin-bottom:3px;}
  .kpi-updown .up span{color:var(--green);}
  .kpi-updown .down span{color:var(--red);}
  .kpi-updown p{margin:0; font-size:0.78rem; line-height:1.5; color:var(--text-2);}
  .kpi-decision{font-size:0.82rem; margin-bottom:10px; line-height:1.5; color:var(--text);}
  .kpi-decision span{color:var(--gold-dark); font-weight:600;}
  .kpi-tags{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
  .kpi-tags span{font-size:0.62rem; text-transform:uppercase; color:var(--text-3); display:block; margin-bottom:2px;}
  .kpi-tags p{margin:0; font-size:0.78rem; line-height:1.4; color:var(--text);}
  .kpi-trap{font-size:0.78rem; background:var(--red-bg); border:1px solid var(--red-border);
    border-radius:6px; padding:8px 10px; line-height:1.5; color:var(--text);}
  .kpi-trap strong{color:var(--red);}

  .causal{margin-bottom:18px;}
  .causal h5{font-family:var(--font-display); margin:0 0 8px; color:var(--gold-dark); font-size:0.92rem;}
  .causal pre{background:rgba(20,16,59,0.05); border-radius:8px; padding:14px 16px; font-family:var(--font-mono);
    font-size:0.78rem; line-height:1.65; overflow-x:auto; margin:0; color:var(--text); white-space:pre;}

  .dim-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
  .dim-chip{background:rgba(20,16,59,0.035); border-radius:8px; padding:12px;}
  .dim-chip strong{font-size:0.85rem; color:var(--accent-dark);}
  .dim-chip p{font-size:0.78rem; margin:6px 0 0; color:var(--text-2); line-height:1.5;}

  .table-scroll{overflow-x:auto;}
  .tbl{width:100%; border-collapse:collapse; font-size:0.82rem;}
  .tbl th{text-align:left; color:var(--gold-dark); font-family:var(--font-display); font-weight:600; padding:10px;
    border-bottom:1px solid var(--border); font-size:0.76rem; white-space:nowrap;}
  .tbl td{padding:10px; border-bottom:1px solid rgba(20,16,59,0.06); vertical-align:top; line-height:1.5; color:var(--text);}
  .charts-tbl th:last-child, .charts-tbl td:last-child{width:112px;}

  .alert-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
  .alert-box{border-radius:10px; padding:14px;}
  .alert-box h5{margin:0 0 8px; font-size:0.85rem; color:var(--text);}
  .alert-box ul{margin:0; padding-left:18px; font-size:0.78rem; line-height:1.65; color:var(--text-2);}
  .alert-box.critica{background:var(--red-bg); border:1px solid var(--red-border);}
  .alert-box.atencion{background:var(--orange-bg); border:1px solid var(--orange-border);}
  .alert-box.normal{background:var(--green-bg); border:1px solid var(--green-border);}
  .alert-note{font-size:0.78rem; color:var(--text-3); line-height:1.65;}

  .avoid-box{margin-top:14px; font-size:0.82rem; background:rgba(20,16,59,0.035); border-left:3px solid var(--red);
    padding:10px 14px; border-radius:0 6px 6px 0; line-height:1.55; color:var(--text-2);}

  .dash-levels{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .dash-card{background:rgba(20,16,59,0.03); border:1px solid var(--border); border-radius:10px; padding:16px;}
  .dash-card h5{margin:0 0 8px; color:var(--gold-dark); font-family:var(--font-display);}
  .dash-card p{font-size:0.82rem; line-height:1.6; margin:0; color:var(--text-2);}

  .case-intro{background:rgba(106,90,196,0.06); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:18px;}
  .case-intro-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .case-intro-head h5{margin:0; font-family:var(--font-display); font-size:1.1rem; color:var(--text);}
  .case-tag{font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; background:rgba(201,162,75,0.2); color:var(--gold-dark); padding:4px 10px; border-radius:20px; white-space:nowrap;}
  .case-meta{font-size:0.76rem; color:var(--text-3); margin:6px 0 10px;}
  .case-intro p.case-context{font-size:0.88rem; color:var(--text-2); line-height:1.6; margin:0;}

  .case-challenge{margin-bottom:18px;}
  .case-challenge h5{color:var(--gold-dark); font-family:var(--font-display); margin:0 0 8px;}
  .case-role{font-style:italic; color:var(--text-2); font-size:0.86rem; margin:0 0 14px;}
  .case-group{margin-bottom:14px;}
  .case-group strong{display:block; color:var(--accent-dark); font-size:0.85rem; margin-bottom:6px;}
  .case-group ol{margin:0; padding-left:20px; font-size:0.86rem; line-height:1.75; color:var(--text);}

  .case-suggestion{background:rgba(201,162,75,0.09); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:24px;}
  .case-suggestion h5{margin:0 0 6px; color:var(--gold-dark); font-family:var(--font-display); font-size:0.9rem;}
  .case-suggestion p{margin:0; font-size:0.86rem; color:var(--text); line-height:1.6;}

  .case-divider{display:flex; align-items:center; gap:12px; margin:26px 0 16px; font-family:var(--font-mono); font-size:0.7rem;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--text-3);}
  .case-divider::before,.case-divider::after{content:''; flex:1; height:1px; background:var(--border);}
  .solved-note{color:var(--text-2); font-style:italic; margin:0 0 10px; font-size:0.85rem;}

  .example-data{margin-bottom:16px;}
  .example-data h5{color:var(--gold-dark); font-family:var(--font-display); margin:0 0 8px;}
  .example-data ul{margin:0; padding-left:18px; font-size:0.85rem; line-height:1.75; color:var(--text);}
  .flow-chain{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-family:var(--font-mono); font-size:0.76rem;
    color:var(--accent-dark); background:rgba(20,16,59,0.045); padding:10px 14px; border-radius:8px; margin-bottom:18px;}
  .flow-chain span:nth-child(odd){color:var(--text);}
  .example-block{margin-bottom:14px;}
  .example-block h5{margin:0 0 6px; font-size:0.85rem; color:var(--purple2);}
  .example-block p,.example-block ul{margin:0; font-size:0.85rem; line-height:1.65; color:var(--text-2);}
  .example-block ul{padding-left:18px;}
  .example-block .result{color:var(--gold-dark); font-weight:600; font-family:var(--font-mono);}
  .example-block.insight{border-left:3px solid var(--blue); padding-left:12px;}
  .example-block.decision{border-left:3px solid var(--gold); padding-left:12px;}

  .pending-panel{display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:70px 0;}
  .pending-icon{font-size:2rem; color:var(--text-3);}
  .pending-panel h2{font-family:var(--font-display); margin:0; color:var(--text);}
  .pending-panel p{color:var(--text-2); max-width:52ch; line-height:1.6; font-size:0.92rem;}

  .chart-thumb{width:96px; cursor:pointer; border-radius:6px; padding:4px; transition:transform .15s ease, box-shadow .15s ease;}
  .chart-thumb:hover{transform:scale(1.05); box-shadow:0 2px 10px rgba(20,16,59,0.14);}
  .chart-thumb svg{width:100%; height:auto; display:block;}
  .chart-popup{position:fixed; display:none; z-index:999; width:min(280px, calc(100vw - 24px)); background:var(--surface);
    border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:0 18px 44px rgba(20,16,59,0.22); pointer-events:none;}
  .chart-popup-label{font-family:var(--font-display); font-size:0.82rem; color:var(--text); margin-bottom:6px;}
  .chart-popup svg{width:100%; height:auto; display:block;}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:relative; height:auto; max-height:60vh;}
    .main{padding:32px 20px;}
    .kpi-grid-wrap{grid-template-columns:1fr;}
    .alert-grid,.dash-levels{grid-template-columns:1fr;}
    .sec-body{padding-left:20px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Manual de KPIs<br>y Dashboards por Área</h1>
    <p class="subtitle">Metodología por área funcional — misión, KPIs, diagnóstico causal, alertas y dashboards.</p>
    <div class="search">
      <input id="searchInput" type="text" placeholder="Buscar área..." oninput="renderSidebar(this.value)">
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="progressText"></span><span id="progressPct"></span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <ul class="tab-list" id="tabList"></ul>
    <div class="sidebar-footer">Se agrega un área completa por sesión, siguiendo la cadencia acordada.</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="chartPopup" class="chart-popup"></div>

<script>
const KPI_TYPES = {
  principal:   { label:'KPI Principal',    color:'#C9A24B', text:'#8A6A1F' },
  secundario:  { label:'KPI Secundario',   color:'#8B7FD9', text:'#5B4FA8' },
  diagnostico: { label:'KPI Diagnóstico',  color:'#6FB1D9', text:'#2E6E92' },
  predictivo:  { label:'KPI Predictivo',   color:'#6FD9A0', text:'#1F7A4C' },
  riesgo:      { label:'KPI de Riesgo',    color:'#E17575', text:'#B03A33' }
};

/* ---------- Mini-chart SVG generators (previews) ---------- */
function svgLineBand(d){
  const values=d.values, targetY=d.targetY;
  const w=240,h=140,pad=18;
  const max=Math.max(...values,targetY)+4, min=Math.min(...values,targetY)-4;
  const plotW=w-pad*2, plotH=h-pad*2;
  const sY=v=>h-pad-((v-min)/(max-min))*plotH;
  const sX=i=>pad+(i/(values.length-1))*plotW;
  const pts=values.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const bandTop=sY(targetY+3), bandBot=sY(targetY-3);
  const dots=values.map((v,i)=>`<circle cx="${sX(i)}" cy="${sY(v)}" r="2.5" fill="#6A5AC4"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect x="${pad}" y="${bandTop}" width="${plotW}" height="${bandBot-bandTop}" fill="rgba(106,90,196,0.14)"/>
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="#6A5AC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}
function svgSparkCard(d){
  const values=d.values;
  const unit=d.unit||'';
  const w=240,h=140,pad=20;
  const max=Math.max(...values), min=Math.min(...values);
  const plotW=w-pad*2, plotH=h-pad*2-34;
  const sY=v=>(h-pad-34)-((v-min)/((max-min)||1))*plotH;
  const sX=i=>pad+(i/(values.length-1))*plotW;
  const pts=values.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const last=values[values.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <text x="${pad}" y="28" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="#14103B">${last}</text>
    <text x="${pad}" y="44" font-family="Inter, sans-serif" font-size="10" fill="rgba(20,16,59,0.5)">${unit}</text>
    <polyline points="${pts}" fill="none" stroke="#C0453D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${sX(values.length-1)}" cy="${sY(last)}" r="3" fill="#C0453D"/>
  </svg>`;
}
function svgFunnel(d){
  const stages=d.stages;
  const w=240,h=140,pad=12;
  const n=stages.length;
  const rowH=(h-pad*2)/n;
  const max=stages[0].value;
  let shapes='';
  stages.forEach((s,i)=>{
    const wTop=(stages[i].value/max)*(w-pad*2);
    const wBot=i<n-1?(stages[i+1].value/max)*(w-pad*2):wTop*0.82;
    const y=pad+i*rowH;
    const xTop=(w-wTop)/2, xBot=(w-wBot)/2;
    const color=i===0?'#6A5AC4':(i===n-1?'#C9A24B':`rgba(106,90,196,${(0.85-i*0.14).toFixed(2)})`);
    shapes+=`<polygon points="${xTop},${y} ${xTop+wTop},${y} ${xBot+wBot},${y+rowH-4} ${xBot},${y+rowH-4}" fill="${color}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${shapes}</svg>`;
}
function svgDualLine(d){
  const a=d.a, b=d.b;
  const w=240,h=140,pad=18;
  const all=[...a,...b];
  const max=Math.max(...all)+1, min=Math.min(...all)-1;
  const plotW=w-pad*2, plotH=h-pad*2;
  const sY=v=>h-pad-((v-min)/(max-min))*plotH;
  const sX=i=>pad+(i/(a.length-1))*plotW;
  const ptsA=a.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const ptsB=b.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <polyline points="${ptsB}" fill="none" stroke="rgba(20,16,59,0.4)" stroke-width="2" stroke-dasharray="4 3"/>
    <polyline points="${ptsA}" fill="none" stroke="#6A5AC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function svgStackedBars(d){
  const rows=d.rows;
  const w=240,h=140,pad=20;
  const n=rows.length;
  const gap=(w-pad*2)/n, barW=gap*0.55;
  const max=Math.max(...rows.map(r=>r.reduce((a,b)=>a+b,0)));
  const colors=['#6A5AC4','#C9A24B','rgba(20,16,59,0.28)'];
  let bars='';
  rows.forEach((r,i)=>{
    let y=h-pad;
    const x=pad+i*gap+(gap-barW)/2;
    r.forEach((seg,si)=>{
      const segH=(seg/max)*(h-pad*2);
      y-=segH;
      bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${segH}" fill="${colors[si%colors.length]}" rx="2"/>`;
    });
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)"/>
    ${bars}
  </svg>`;
}
function svgRankedBars(d){
  const values=d.values, threshold=d.threshold;
  const w=240,h=140,pad=20;
  const n=values.length;
  const rowH=(h-pad*2)/n;
  const max=Math.max(...values,threshold)+2;
  let bars='';
  values.forEach((v,i)=>{
    const y=pad+i*rowH+rowH*0.22;
    const bw=(v/max)*(w-pad*2-10);
    bars+=`<rect x="${pad}" y="${y}" width="${bw}" height="${rowH*0.56}" rx="3" fill="${i===0?'#C9A24B':'#6A5AC4'}"/>`;
  });
  const tx=pad+(threshold/max)*(w-pad*2-10);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${bars}
    <line x1="${tx}" y1="${pad-4}" x2="${tx}" y2="${h-pad+4}" stroke="#C0453D" stroke-width="2" stroke-dasharray="3 3"/>
  </svg>`;
}
function svgBullet(d){
  const value=d.value, target=d.target, max=d.max;
  const w=240,h=90,pad=18;
  const barY=h/2-11, barH=22;
  const sX=v=>pad+(v/max)*(w-pad*2);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect x="${pad}" y="${barY}" width="${w-pad*2}" height="${barH}" rx="4" fill="rgba(20,16,59,0.08)"/>
    <rect x="${pad}" y="${barY}" width="${sX(max*0.55)-pad}" height="${barH}" rx="4" fill="rgba(106,90,196,0.2)"/>
    <rect x="${pad}" y="${barY+5}" width="${sX(value)-pad}" height="${barH-10}" rx="3" fill="#6A5AC4"/>
    <line x1="${sX(target)}" y1="${barY-8}" x2="${sX(target)}" y2="${barY+barH+8}" stroke="#C9A24B" stroke-width="3"/>
  </svg>`;
}
function svgVariance(d){
  const items=d.items;
  const w=240,h=140,pad=20;
  const maxAbs=Math.max(...items.map(i=>Math.abs(i.value)));
  const midX=w/2;
  const rowH=(h-pad*2)/items.length;
  const scale=v=>(Math.abs(v)/maxAbs)*(w/2-pad-6);
  let bars='';
  items.forEach((it,i)=>{
    const y=pad+i*rowH+rowH*0.22;
    const bw=scale(it.value);
    const x=it.value>=0?midX:midX-bw;
    const color=it.value>=0?'#2F8F5B':'#C0453D';
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${rowH*0.56}" rx="2" fill="${color}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${midX}" y1="${pad-4}" x2="${midX}" y2="${h-pad+4}" stroke="rgba(20,16,59,0.3)" stroke-width="1.5"/>
    ${bars}
  </svg>`;
}
function svgBreakeven(d){
  const w=240,h=140,pad=20;
  const fixed=d.fixed, varRate=d.varRate, maxX=100;
  const sX=x=>pad+(x/maxX)*(w-pad*2);
  const costEnd=fixed+varRate*maxX;
  const maxY=Math.max(maxX,costEnd);
  const sY=y=>h-pad-(y/maxY)*(h-pad*2);
  const bx=fixed/(1-varRate);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${sX(0)}" y1="${h-pad}" x2="${sX(maxX)}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)"/>
    <line x1="${sX(0)}" y1="${sY(0)}" x2="${sX(maxX)}" y2="${sY(maxX)}" stroke="#6A5AC4" stroke-width="2.5"/>
    <line x1="${sX(0)}" y1="${sY(fixed)}" x2="${sX(maxX)}" y2="${sY(costEnd)}" stroke="#C0453D" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="${sX(bx)}" cy="${sY(bx)}" r="3.5" fill="#C9A24B"/>
  </svg>`;
}
function svgColumns(d){
  const values=d.values;
  const w=240,h=140,pad=20;
  const n=values.length;
  const gap=(w-pad*2)/n, barW=gap*0.55;
  const max=Math.max(...values);
  let bars='';
  values.forEach((v,i)=>{
    const bh=(v/max)*(h-pad*2);
    const x=pad+i*gap+(gap-barW)/2;
    const y=h-pad-bh;
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="2" fill="#6A5AC4"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)"/>
    ${bars}
  </svg>`;
}
function svgTwoBars(d){
  const w=240,h=140,pad=24;
  const max=Math.max(d.a,d.b)*1.2;
  const bw=50,gap=40;
  const startX=w/2-(bw*2+gap)/2;
  const hA=(d.a/max)*(h-pad*2), hB=(d.b/max)*(h-pad*2);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)"/>
    <rect x="${startX}" y="${h-pad-hA}" width="${bw}" height="${hA}" rx="3" fill="#8B7FD9"/>
    <rect x="${startX+bw+gap}" y="${h-pad-hB}" width="${bw}" height="${hB}" rx="3" fill="#6A5AC4"/>
  </svg>`;
}
function svgAreaLine(d){
  const values=d.values, minLine=d.minLine;
  const w=240,h=140,pad=18;
  const max=Math.max(...values,minLine)+8, min=Math.min(...values,minLine)-8;
  const plotW=w-pad*2, plotH=h-pad*2;
  const sY=v=>h-pad-((v-min)/(max-min))*plotH;
  const sX=i=>pad+(i/(values.length-1))*plotW;
  const pts=values.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const areaPts=`${sX(0)},${h-pad} ${pts} ${sX(values.length-1)},${h-pad}`;
  const minY=sY(minLine);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <polygon points="${areaPts}" fill="rgba(106,90,196,0.14)"/>
    <line x1="${pad}" y1="${minY}" x2="${w-pad}" y2="${minY}" stroke="#C0453D" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polyline points="${pts}" fill="none" stroke="#6A5AC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function svgDonut(d){
  const segments=d.segments;
  const w=240,h=140,cx=w/2,cy=h/2,r=48,circumference=2*Math.PI*r;
  const total=segments.reduce((a,s)=>a+s.value,0);
  let offset=0;
  const circles=segments.map(s=>{
    const frac=s.value/total;
    const dash=frac*circumference;
    const gap=circumference-dash;
    const c=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=dash;
    return c;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${circles}
    <circle cx="${cx}" cy="${cy}" r="${r-20}" fill="#FFFFFF"/>
  </svg>`;
}
function buildPreviewSVG(p){
  if(!p) return '';
  switch(p.type){
    case 'lineBand': return svgLineBand(p.data);
    case 'sparkCard': return svgSparkCard(p.data);
    case 'dualLine': return svgDualLine(p.data);
    case 'stackedBars': return svgStackedBars(p.data);
    case 'rankedBars': return svgRankedBars(p.data);
    case 'bullet': return svgBullet(p.data);
    case 'variance': return svgVariance(p.data);
    case 'breakeven': return svgBreakeven(p.data);
    case 'columns': return svgColumns(p.data);
    case 'twoBars': return svgTwoBars(p.data);
    case 'areaLine': return svgAreaLine(p.data);
    case 'donut': return svgDonut(p.data);
    case 'funnel': return svgFunnel(p.data);
    default: return '';
  }
}
function showChartPopup(evt,i){
  const item=(window.currentPreviews||[])[i];
  if(!item) return;
  const popup=document.getElementById('chartPopup');
  popup.innerHTML=`<div class="chart-popup-label">${item.label}</div>${item.svg}`;
  const rect=evt.currentTarget.getBoundingClientRect();
  let left=rect.right+14, top=rect.top-30;
  const popW=280;
  if(left+popW>window.innerWidth) left=rect.left-popW-14;
  if(left<8) left=8;
  if(top<8) top=8;
  if(top+220>window.innerHeight) top=window.innerHeight-228;
  popup.style.left=left+'px'; popup.style.top=top+'px'; popup.style.display='block';
}
function hideChartPopup(){ document.getElementById('chartPopup').style.display='none'; }
document.addEventListener('click', function(e){
  if(!e.target.closest || (!e.target.closest('.chart-thumb') && !e.target.closest('.chart-popup'))){
    hideChartPopup();
  }
});

  { id:'proyectos', num:14, name:'Proyectos', ready:false },
  { id:'ecommerce', num:15, name:'E-commerce / Canales Digitales', ready:false },
  { id:'costos', num:16, name:'Costos y Rentabilidad', ready:false },
  { id:'cobranzas', num:17, name:'Cobranzas / Cuentas por Cobrar', ready:false },
  { id:'inversionistas', num:18, name:'Inversionistas / Capital', ready:false }
];

let activeId = 'direccion';

function renderSidebar(filter=''){
  const f = filter.trim().toLowerCase();
  const list = document.getElementById('tabList');
  list.innerHTML = areasData
    .filter(a => a.name.toLowerCase().includes(f))
    .map(a => `
      <li class="tab-item ${a.ready?'':'pending'} ${a.id===activeId?'active':''}" onclick="selectArea('${a.id}')">
        <span class="n">${String(a.num).padStart(2,'0')}</span>
        <span class="dot"></span>
        <span class="name">${a.name}</span>
      </li>`).join('');

  const total = areasData.length;
  const done = areasData.filter(a=>a.ready).length;
  document.getElementById('progressText').textContent = `${done} de ${total} áreas completas`;
  document.getElementById('progressPct').textContent = Math.round(done/total*100)+'%';
  document.getElementById('progressFill').style.width = Math.round(done/total*100)+'%';
}

function kpiCardHTML(k){
  const t = KPI_TYPES[k.type];
  return `<article class="kpi-card" style="--kc:${t.color}; --kct:${t.text}">
    <div class="kpi-card__head">
      <span class="kpi-tag">${t.label}</span>
      <h4>${k.name}</h4>
    </div>
    <p class="kpi-card__def">${k.definicion}</p>
    <div class="kpi-meta-row">
      <div class="kpi-meta"><span>Unidad</span><strong>${k.unidad}</strong></div>
      <div class="kpi-meta"><span>Frecuencia</span><strong>${k.frecuencia}</strong></div>
      <div class="kpi-meta"><span>Objetivo</span><strong>${k.objetivo}</strong></div>
      <div class="kpi-meta"><span>Benchmark</span><strong>${k.benchmark}</strong></div>
    </div>
    <div class="kpi-formula"><span>Fórmula</span><code>${k.formula}</code></div>
    <p class="kpi-interp"><span>Interpretación — </span>${k.interpretacion}</p>
    <div class="kpi-updown">
      <div class="up"><span>↑ Si sube</span><p>${k.siSube}</p></div>
      <div class="down"><span>↓ Si baja</span><p>${k.siBaja}</p></div>
    </div>
    <p class="kpi-decision"><span>Decisión que habilita — </span>${k.decision}</p>
    <div class="kpi-tags">
      <div><span>Datos necesarios</span><p>${k.datos}</p></div>
      <div><span>Dimensiones</span><p>${k.dimensiones}</p></div>
    </div>
    <div class="kpi-trap">⚠ <strong>Trampa:</strong> ${k.trampa}</div>
  </article>`;
}

function renderArea(area){
  if(!area.ready){
    return `<div class="pending-panel">
      <span class="pending-icon">○</span>
      <h2>${area.name}</h2>
      <p>Esta área todavía no está desarrollada. Se agrega en una próxima sesión, siguiendo la cadencia acordada: un área completa por mensaje.</p>
    </div>`;
  }
  const d = area.data;
  window.currentPreviews = d.charts.map(c => ({ svg: buildPreviewSVG(c.preview), label: c.kpi }));

  return `
    <div class="area-eyebrow">ÁREA ${String(area.num).padStart(2,'0')}</div>
    <h1 class="area-title">${area.name}</h1>
    <p class="area-mission">${d.mission}</p>
    <div class="toolbar">
      <button onclick="toggleAll(true)">Expandir todo</button>
      <button onclick="toggleAll(false)">Colapsar todo</button>
    </div>

    <details class="section" open>
      <summary><span class="sec-letter">A</span> ¿Cuál es la misión del área?</summary>
      <div class="sec-body"><p>${d.mission}</p></div>
    </details>

    <details class="section">
      <summary><span class="sec-letter">B</span> ¿Qué decisiones toma?</summary>
      <div class="sec-body"><ul class="clean-list">${d.decisions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </details>

    <details class="section">
      <summary><span class="sec-letter">C</span> Preguntas de negocio</summary>
      <div class="sec-body"><ol class="q-list">${d.questions.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    </details>

    <details class="section" open>
      <summary><span class="sec-letter">D</span> KPIs estratégicos</summary>
      <div class="sec-body kpi-grid-wrap">${d.kpis.map(kpiCardHTML).join('')}</div>
    </details>

    <details class="section">
      <summary><span class="sec-letter">E</span> Métricas diagnósticas — árboles causales</summary>
      <div class="sec-body">${d.causal.map(c=>`<div class="causal"><h5>${c.kpi} ↓</h5><pre>${c.tree}</pre></div>`).join('')}</div>
    </details>

    <details class="section">
      <summary><span class="sec-letter">F</span> Dimensiones de análisis</summary>
      <div class="sec-body dim-grid">${d.dimensions.map(x=>`<div class="dim-chip"><strong>${x.name}</strong><p>${x.desc}</p></div>`).join('')}</div>
    </details>

    <details class="section">
      <summary><span class="sec-letter">G</span> Comparaciones</summary>
      <div class="sec-body"><div class="table-scroll"><table class="tbl"><thead><tr><th>Comparación</th><th>Utilidad</th></tr></thead>
      <tbody>${d.comparisons.map(x=>`<tr><td>${x.name}</td><td>${x.utilidad}</td></tr>`).join('')}</tbody></table></div></div>
    </details>

    <details class="section">
      <summary><span class="sec-letter">H</span> Alertas</summary>
      <div class="sec-body">
        <div class="alert-grid">
          <div class="alert-box critica"><h5>🔴 Crítica</h5><ul>${d.alerts.critica.map(x=>`<li>${x}</li>`).join('')}</ul></div>
          <div class="alert-box atencion"><h5>🟠 Atención</h5><ul>${d.alerts.atencion.map(x=>`<li>${x}</li>`).join('')}</ul></div>
          <div class="alert-box normal"><h5>🟢 Normal</h5><ul>${d.alerts.normal.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        </div>
        <p class="alert-note">${d.alerts.note}</p>
      </div>
    </details>

    <details class="section">
      <summary><span class="sec-letter">I</span> Gráficos recomendados</summary>
      <div class="sec-body">
        <div class="table-scroll">
        <table class="tbl charts-tbl"><thead><tr><th>KPI</th><th>Gráfico principal</th><th>Alternativa</th><th>Por qué</th><th>Vista previa</th></tr></thead>
        <tbody>${d.charts.map((x,i)=>`<tr><td>${x.kpi}</td><td>${x.principal}</td><td>${x.alternativa}</td><td>${x.porque}</td>
          <td><div class="chart-thumb" onmouseenter="showChartPopup(event, ${i})" onclick="showChartPopup(event, ${i})" onmouseleave="hideChartPopup()">${window.currentPreviews[i].svg}</div></td></tr>`).join('')}</tbody></table>
        </div>
        <div class="avoid-box"><strong>Evitar en este dashboard:</strong> ${d.avoid}</div>
      </div>
    </details>

    <details class="section">
      <summary><span class="sec-letter">J</span> Dashboard del área</summary>
      <div class="sec-body dash-levels">
        <div class="dash-card"><h5>Ejecutivo</h5><p>${d.dashboards.ejecutivo}</p></div>
        <div class="dash-card"><h5>Gerencial</h5><p>${d.dashboards.gerencial}</p></div>
        <div class="dash-card"><h5>Operativo</h5><p>${d.dashboards.operativo}</p></div>
      </div>
    </details>

    <details class="section">
      <summary><span class="sec-letter">K</span> Caso de negocio — ejercicio práctico</summary>
      <div class="sec-body">
        <div class="case-intro">
          <div class="case-intro-head">
            <h5>${d.case.company.name}</h5>
            <span class="case-tag">${d.case.company.segment}</span>
          </div>
          <p class="case-meta">Fundada en ${d.case.company.founded}</p>
          <p class="case-context">${d.case.company.context}</p>
        </div>

        <div class="case-challenge">
          <h5>Desafío</h5>
          <p class="case-role">${d.case.challenge.role}</p>
          ${d.case.challenge.groups.map(g=>`
            <div class="case-group">
              <strong>${g.theme}</strong>
              <ol>${g.questions.map(q=>`<li>${q}</li>`).join('')}</ol>
            </div>`).join('')}
        </div>

        <div class="case-suggestion">
          <h5>Sugerencia</h5>
          <p>${d.case.suggestion}</p>
        </div>

        <div class="case-divider">Solución razonada</div>

        <p class="solved-note">Con los datos de ${d.case.company.name} para este trimestre:</p>
        <div class="example-data"><h5>Datos</h5><ul>${d.solved.datos.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div class="flow-chain">
          <span>Datos</span><span>→</span><span>KPI</span><span>→</span><span>Comparación</span><span>→</span><span>Análisis</span><span>→</span><span>Gráfico</span><span>→</span><span>Insight</span><span>→</span><span>Decisión</span>
        </div>
        <div class="example-block"><h5>→ KPI</h5><ul>${d.solved.kpiCalcs.map(x=>`<li><strong>${x.label}</strong> = ${x.calc} = <span class="result">${x.result}</span></li>`).join('')}</ul></div>
        <div class="example-block"><h5>→ Comparación</h5><p>${d.solved.comparacion}</p></div>
        <div class="example-block"><h5>→ Análisis</h5><p>${d.solved.analisis}</p></div>
        <div class="example-block"><h5>→ Gráfico</h5><p>${d.solved.grafico}</p></div>
        <div class="example-block insight"><h5>→ Insight</h5><p>${d.solved.insight}</p></div>
        <div class="example-block decision"><h5>→ Decisión</h5><p>${d.solved.decision}</p></div>
      </div>
    </details>
  `;
}

function selectArea(id){
  const area = areasData.find(a=>a.id===id);
  if(!area) return;
  activeId = id;
  hideChartPopup();
  document.getElementById('main').innerHTML = renderArea(area);
  renderSidebar(document.getElementById('searchInput').value);
  window.scrollTo(0,0);
}

function toggleAll(open){
  document.querySelectorAll('#main details').forEach(d=>d.open=open);
}

renderSidebar();
selectArea('direccion');
</script>
</body>
</html>
