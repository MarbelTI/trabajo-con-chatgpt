<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual de KPIs, Dashboards y Visualización de Datos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3FB; --surface:#FFFFFF; --surface-2:#EEEBFA; --border:rgba(20,16,59,0.12);
    --text:#14103B; --text-2:rgba(20,16,59,0.62); --text-3:rgba(20,16,59,0.45);
    --accent:#6A5AC4; --accent-dark:#4A3F94; --gold:#C9A24B; --gold-dark:#8A6A1F;
    --red:#C0453D; --red-bg:rgba(192,69,61,0.08); --red-border:rgba(192,69,61,0.3);
    --orange:#B9791E; --orange-bg:rgba(185,121,30,0.08); --orange-border:rgba(185,121,30,0.3);
    --green:#2F8F5B; --green-bg:rgba(47,143,91,0.08); --green-border:rgba(47,143,91,0.3);
    --blue:#2E6E92; --purple2:#5B4FA8;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1100px 700px at 100% -10%, rgba(106,90,196,0.10), transparent 60%), var(--bg);
    color:var(--text); font-family:var(--font-body); min-height:100vh;
  }
  .app{display:grid; grid-template-columns:300px 1fr; min-height:100vh;}
  .sidebar{background:var(--surface-2); border-right:1px solid var(--border);
    padding:28px 20px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .sidebar h1{font-family:var(--font-display); font-size:1.05rem; letter-spacing:0.02em; margin:0 0 4px; line-height:1.3; color:var(--accent-dark);}
  .sidebar .subtitle{font-size:0.76rem; color:var(--text-2); margin:0 0 20px; line-height:1.5;}
  .search input{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:9px 12px; font-family:var(--font-body); font-size:0.83rem;}
  .search input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .search input::placeholder{color:var(--text-3);}
  .progress-wrap{margin:18px 0 20px;}
  .progress-label{font-size:0.7rem; color:var(--text-2); display:flex; justify-content:space-between; margin-bottom:6px;}
  .progress-bar{height:5px; background:rgba(20,16,59,0.08); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--accent));}
  .tab-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .tab-item{display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; cursor:pointer; font-size:0.83rem; border-left:2px solid transparent;}
  .tab-item .n{font-family:var(--font-mono); font-size:0.68rem; color:var(--text-3); width:16px; flex-shrink:0;}
  .tab-item .name{line-height:1.3;}
  .tab-item.pending{opacity:0.55;}
  .tab-item.active{background:rgba(106,90,196,0.14); border-left-color:var(--gold); font-weight:600;}
  .tab-item:not(.pending):hover{background:rgba(20,16,59,0.05);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green); flex-shrink:0;}
  .tab-item.pending .dot{background:rgba(20,16,59,0.18);}
  .sidebar-footer{margin-top:22px; padding-top:16px; border-top:1px solid var(--border); font-size:0.7rem; color:var(--text-3); line-height:1.6;}
  .nav-group{margin-bottom:6px;}
  .nav-group-label{font-family:var(--font-mono); font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-3); margin:16px 0 6px; padding-left:2px;}

  .fund-content h3{font-family:var(--font-display); font-size:1.15rem; color:var(--text); margin:30px 0 12px;}
  .fund-content h3:first-child{margin-top:0;}
  .fund-content h4{font-family:var(--font-display); font-size:0.95rem; color:var(--gold-dark); margin:20px 0 8px;}
  .fund-content p{font-size:0.92rem; line-height:1.7; color:var(--text-2); margin:0 0 14px; max-width:76ch;}
  .fund-content ul, .fund-content ol{font-size:0.92rem; line-height:1.85; color:var(--text); margin:0 0 16px; padding-left:22px; max-width:74ch;}
  .fund-content strong{color:var(--text); font-weight:600;}
  .callout{border-radius:10px; padding:14px 18px; margin:18px 0; font-size:0.9rem; line-height:1.65; max-width:74ch;}
  .callout .callout-label{display:block; font-family:var(--font-display); font-weight:700; margin-bottom:5px; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em;}
  .callout.idea{background:rgba(201,162,75,0.08); border-left:3px solid var(--gold); color:var(--text);}
  .callout.idea .callout-label{color:var(--gold-dark);}
  .callout.note{background:rgba(106,90,196,0.06); border-left:3px solid var(--accent); color:var(--text);}
  .callout.note .callout-label{color:var(--accent-dark);}
  .roadmap-item{display:flex; align-items:flex-start; gap:14px; padding:14px 0; border-bottom:1px solid var(--border);}
  .roadmap-item:last-child{border-bottom:none;}
  .roadmap-num{font-family:var(--font-mono); font-size:0.75rem; color:var(--text-3); width:28px; flex-shrink:0; padding-top:2px;}
  .roadmap-body h5{margin:0 0 4px; font-family:var(--font-display); font-size:0.92rem; color:var(--text);}
  .roadmap-body p{margin:0; font-size:0.84rem; color:var(--text-2); line-height:1.55;}
  .roadmap-status{font-size:0.68rem; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.04em; padding:3px 9px; border-radius:20px; flex-shrink:0; margin-top:2px;}
  .roadmap-status.done{background:rgba(47,143,91,0.12); color:var(--green);}
  .roadmap-status.pending{background:rgba(20,16,59,0.06); color:var(--text-3);}

  .family-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(370px,1fr)); gap:16px; margin:18px 0 26px;}
  .family-card{border:1px solid var(--border); border-radius:12px; padding:18px; background:var(--surface);}
  .family-card.primaria{border-top:3px solid var(--accent);}
  .family-card.aplicada{border-top:3px solid var(--gold);}
  .family-card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px;}
  .family-card h4{margin:0; font-family:var(--font-display); font-size:1.03rem; color:var(--text);}
  .family-badge{font-size:0.62rem; text-transform:uppercase; letter-spacing:0.05em; padding:3px 9px; border-radius:20px; font-family:var(--font-mono); flex-shrink:0; white-space:nowrap;}
  .family-badge.primaria{background:rgba(106,90,196,0.12); color:var(--accent-dark);}
  .family-badge.aplicada{background:rgba(201,162,75,0.15); color:var(--gold-dark);}
  .family-derives{font-size:0.72rem; color:var(--text-3); margin:0 0 10px; font-style:italic;}
  .family-card p{font-size:0.84rem; line-height:1.6; color:var(--text-2); margin:0 0 10px;}
  .family-card .fc-label{font-size:0.66rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-3); display:block; margin-bottom:4px;}
  .family-charts{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .chart-chip{font-size:0.74rem; background:rgba(20,16,59,0.045); border:1px solid var(--border); padding:4px 10px; border-radius:20px; color:var(--text);}
  .family-warn{font-size:0.79rem; background:rgba(192,69,61,0.06); border-left:3px solid var(--red); padding:8px 12px; border-radius:0 6px 6px 0; color:var(--text-2); line-height:1.5; margin:0;}

  .chart-ficha{border:1px solid var(--border); border-radius:14px; padding:22px; background:var(--surface); margin-bottom:20px;}
  .ficha-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .ficha-familia{font-family:var(--font-mono); font-size:0.7rem; color:var(--text-3); text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:4px;}
  .chart-ficha h3{margin:0; font-family:var(--font-display); font-size:1.28rem; color:var(--text);}
  .ficha-en{font-size:0.82rem; font-weight:400; color:var(--text-3); font-style:italic;}
  .ficha-badges{display:flex; gap:6px; flex-wrap:wrap;}
  .ficha-badge{font-size:0.68rem; padding:4px 10px; border-radius:20px; font-family:var(--font-mono); font-weight:600; white-space:nowrap;}
  .ficha-question{background:rgba(106,90,196,0.06); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:10px 16px; margin-bottom:14px; font-size:0.92rem; color:var(--text);}
  .ficha-question span{display:block; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent-dark); margin-bottom:3px; font-family:var(--font-mono);}
  .ficha-patron{font-size:0.9rem; color:var(--text); line-height:1.6; margin:0 0 16px; max-width:78ch;}
  .ficha-block{margin-bottom:16px;}
  .ficha-block h5{font-family:var(--font-display); font-size:0.85rem; color:var(--gold-dark); margin:0 0 8px;}
  .ficha-vars{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
  .ficha-vars > div{background:rgba(20,16,59,0.035); border-radius:8px; padding:8px 10px;}
  .ficha-vars span{font-size:0.62rem; text-transform:uppercase; color:var(--text-3); display:block; margin-bottom:2px;}
  .ficha-vars p{margin:0; font-size:0.82rem; color:var(--text);}
  .ficha-errors{background:var(--red-bg); border:1px solid var(--red-border); border-radius:8px; padding:12px 16px; margin-bottom:16px;}
  .ficha-errors h5{color:var(--red); margin:0 0 6px; font-family:var(--font-display); font-size:0.85rem;}
  .ficha-errors ul{margin:0; padding-left:18px; font-size:0.85rem; line-height:1.6; color:var(--text-2);}
  .ficha-example{background:rgba(20,16,59,0.025); border:1px solid var(--border); border-radius:12px; padding:14px 10px 6px; margin-bottom:16px; text-align:center;}
  .ficha-example svg{width:100%; max-width:400px; height:auto; display:block; margin:0 auto;}
  .ficha-example-caption{display:block; font-size:0.68rem; color:var(--text-3); margin-top:6px; font-style:italic;}

  .main{padding:52px 64px; max-width:1000px;}
  .area-eyebrow{font-family:var(--font-mono); color:var(--gold-dark); font-size:0.78rem; letter-spacing:0.12em;}
  .area-title{font-family:var(--font-display); font-size:2.05rem; margin:6px 0 14px; line-height:1.2; color:var(--text);}
  .area-mission{font-size:1rem; color:var(--text-2); max-width:72ch; line-height:1.65; margin-bottom:22px;}
  .toolbar{display:flex; gap:10px; margin-bottom:26px;}
  .toolbar button{background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 14px;
    border-radius:20px; font-size:0.78rem; cursor:pointer; font-family:var(--font-body);}
  .toolbar button:hover{border-color:var(--gold); color:var(--gold-dark);}

  .section{border:1px solid var(--border); border-radius:12px; margin-bottom:14px; background:var(--surface); overflow:hidden;
    box-shadow:0 1px 3px rgba(20,16,59,0.04);}
  .section summary{list-style:none; cursor:pointer; padding:16px 20px; display:flex; align-items:center; gap:14px;
    font-family:var(--font-display); font-size:1rem; user-select:none; color:var(--text);}
  .section summary::-webkit-details-marker{display:none;}
  .section summary::after{content:'+'; margin-left:auto; color:var(--gold); font-size:1.2rem;}
  .section[open] summary::after{content:'–';}
  .sec-letter{width:30px;height:30px;border-radius:8px;background:rgba(201,162,75,0.16); color:var(--gold-dark);
    display:flex; align-items:center; justify-content:center; font-size:0.85rem; flex-shrink:0;}
  .sec-body{padding:0 20px 22px 64px;}

  .clean-list,.q-list{margin:0; padding-left:20px; line-height:1.85; font-size:0.9rem;}
  .q-list{color:var(--text-2);}

  .kpi-grid-wrap{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px;}
  .kpi-card{--kc:#C9A24B; --kct:#8A6A1F; border:1px solid var(--border); border-top:3px solid var(--kc); border-radius:10px;
    padding:16px; background:var(--surface);}
  .kpi-card__head{display:flex; flex-direction:column; gap:4px; margin-bottom:8px;}
  .kpi-tag{font-family:var(--font-mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--kct);}
  .kpi-card h4{margin:0; font-family:var(--font-display); font-size:1.02rem; color:var(--text);}
  .kpi-card__def{font-size:0.85rem; color:var(--text-2); margin:0 0 12px; line-height:1.5;}
  .kpi-meta-row{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:10px;}
  .kpi-meta{background:rgba(20,16,59,0.045); border-radius:6px; padding:6px 8px;}
  .kpi-meta span{display:block; font-size:0.62rem; color:var(--text-3); text-transform:uppercase; letter-spacing:0.04em;}
  .kpi-meta strong{font-size:0.8rem; font-weight:600; color:var(--text);}
  .kpi-formula{background:rgba(20,16,59,0.05); border-radius:6px; padding:8px 10px; margin-bottom:10px; font-size:0.8rem;}
  .kpi-formula span{display:block; font-size:0.62rem; color:var(--gold-dark); margin-bottom:3px; text-transform:uppercase;}
  .kpi-formula code{font-family:var(--font-mono); color:var(--text);}
  .kpi-interp{font-size:0.82rem; line-height:1.55; margin-bottom:10px; color:var(--text);}
  .kpi-interp span{color:var(--gold-dark); font-weight:600;}
  .kpi-updown{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
  .kpi-updown .up span,.kpi-updown .down span{font-size:0.66rem; font-weight:700; display:block; margin-bottom:3px;}
  .kpi-updown .up span{color:var(--green);}
  .kpi-updown .down span{color:var(--red);}
  .kpi-updown p{margin:0; font-size:0.78rem; line-height:1.5; color:var(--text-2);}
  .kpi-decision{font-size:0.82rem; margin-bottom:10px; line-height:1.5; color:var(--text);}
  .kpi-decision span{color:var(--gold-dark); font-weight:600;}
  .kpi-tags{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
  .kpi-tags span{font-size:0.62rem; text-transform:uppercase; color:var(--text-3); display:block; margin-bottom:2px;}
  .kpi-tags p{margin:0; font-size:0.78rem; line-height:1.4; color:var(--text);}
  .kpi-trap{font-size:0.78rem; background:var(--red-bg); border:1px solid var(--red-border);
    border-radius:6px; padding:8px 10px; line-height:1.5; color:var(--text);}
  .kpi-trap strong{color:var(--red);}

  .causal{margin-bottom:18px;}
  .causal h5{font-family:var(--font-display); margin:0 0 8px; color:var(--gold-dark); font-size:0.92rem;}
  .causal pre{background:rgba(20,16,59,0.05); border-radius:8px; padding:14px 16px; font-family:var(--font-mono);
    font-size:0.78rem; line-height:1.65; overflow-x:auto; margin:0; color:var(--text); white-space:pre;}

  .dim-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
  .dim-chip{background:rgba(20,16,59,0.035); border-radius:8px; padding:12px;}
  .dim-chip strong{font-size:0.85rem; color:var(--accent-dark);}
  .dim-chip p{font-size:0.78rem; margin:6px 0 0; color:var(--text-2); line-height:1.5;}

  .table-scroll{overflow-x:auto;}
  .tbl{width:100%; border-collapse:collapse; font-size:0.82rem;}
  .tbl th{text-align:left; color:var(--gold-dark); font-family:var(--font-display); font-weight:600; padding:10px;
    border-bottom:1px solid var(--border); font-size:0.76rem; white-space:nowrap;}
  .tbl td{padding:10px; border-bottom:1px solid rgba(20,16,59,0.06); vertical-align:top; line-height:1.5; color:var(--text);}
  .charts-tbl th:last-child, .charts-tbl td:last-child{width:112px;}

  .alert-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
  .alert-box{border-radius:10px; padding:14px;}
  .alert-box h5{margin:0 0 8px; font-size:0.85rem; color:var(--text);}
  .alert-box ul{margin:0; padding-left:18px; font-size:0.78rem; line-height:1.65; color:var(--text-2);}
  .alert-box.critica{background:var(--red-bg); border:1px solid var(--red-border);}
  .alert-box.atencion{background:var(--orange-bg); border:1px solid var(--orange-border);}
  .alert-box.normal{background:var(--green-bg); border:1px solid var(--green-border);}
  .alert-note{font-size:0.78rem; color:var(--text-3); line-height:1.65;}

  .avoid-box{margin-top:14px; font-size:0.82rem; background:rgba(20,16,59,0.035); border-left:3px solid var(--red);
    padding:10px 14px; border-radius:0 6px 6px 0; line-height:1.55; color:var(--text-2);}

  .dash-levels{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .dash-card{background:rgba(20,16,59,0.03); border:1px solid var(--border); border-radius:10px; padding:16px;}
  .dash-card h5{margin:0 0 8px; color:var(--gold-dark); font-family:var(--font-display);}
  .dash-card p{font-size:0.82rem; line-height:1.6; margin:0; color:var(--text-2);}

  .case-intro{background:rgba(106,90,196,0.06); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:18px;}
  .case-intro-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .case-intro-head h5{margin:0; font-family:var(--font-display); font-size:1.1rem; color:var(--text);}
  .case-tag{font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; background:rgba(201,162,75,0.2); color:var(--gold-dark); padding:4px 10px; border-radius:20px; white-space:nowrap;}
  .case-meta{font-size:0.76rem; color:var(--text-3); margin:6px 0 10px;}
  .case-intro p.case-context{font-size:0.88rem; color:var(--text-2); line-height:1.6; margin:0;}

  .case-challenge{margin-bottom:18px;}
  .case-challenge h5{color:var(--gold-dark); font-family:var(--font-display); margin:0 0 8px;}
  .case-role{font-style:italic; color:var(--text-2); font-size:0.86rem; margin:0 0 14px;}
  .case-group{margin-bottom:14px;}
  .case-group strong{display:block; color:var(--accent-dark); font-size:0.85rem; margin-bottom:6px;}
  .case-group ol{margin:0; padding-left:20px; font-size:0.86rem; line-height:1.75; color:var(--text);}

  .case-suggestion{background:rgba(201,162,75,0.09); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:24px;}
  .case-suggestion h5{margin:0 0 6px; color:var(--gold-dark); font-family:var(--font-display); font-size:0.9rem;}
  .case-suggestion p{margin:0; font-size:0.86rem; color:var(--text); line-height:1.6;}

  .case-divider{display:flex; align-items:center; gap:12px; margin:26px 0 16px; font-family:var(--font-mono); font-size:0.7rem;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--text-3);}
  .case-divider::before,.case-divider::after{content:''; flex:1; height:1px; background:var(--border);}
  .solved-note{color:var(--text-2); font-style:italic; margin:0 0 10px; font-size:0.85rem;}

  .example-data{margin-bottom:16px;}
  .example-data h5{color:var(--gold-dark); font-family:var(--font-display); margin:0 0 8px;}
  .example-data ul{margin:0; padding-left:18px; font-size:0.85rem; line-height:1.75; color:var(--text);}
  .flow-chain{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-family:var(--font-mono); font-size:0.76rem;
    color:var(--accent-dark); background:rgba(20,16,59,0.045); padding:10px 14px; border-radius:8px; margin-bottom:18px;}
  .flow-chain span:nth-child(odd){color:var(--text);}
  .example-block{margin-bottom:14px;}
  .example-block h5{margin:0 0 6px; font-size:0.85rem; color:var(--purple2);}
  .example-block p,.example-block ul{margin:0; font-size:0.85rem; line-height:1.65; color:var(--text-2);}
  .example-block ul{padding-left:18px;}
  .example-block .result{color:var(--gold-dark); font-weight:600; font-family:var(--font-mono);}
  .example-block.insight{border-left:3px solid var(--blue); padding-left:12px;}
  .example-block.decision{border-left:3px solid var(--gold); padding-left:12px;}

  .pending-panel{display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:70px 0;}
  .pending-icon{font-size:2rem; color:var(--text-3);}

</style>

<body>
<div class="app">

</div>
<div id="chartPopup" class="chart-popup"></div>

<script>
const KPI_TYPES = {
  principal:   { label:'KPI Principal',    color:'#C9A24B', text:'#8A6A1F' },
  secundario:  { label:'KPI Secundario',   color:'#8B7FD9', text:'#5B4FA8' },
  diagnostico: { label:'KPI Diagnóstico',  color:'#6FB1D9', text:'#2E6E92' },
  predictivo:  { label:'KPI Predictivo',   color:'#6FD9A0', text:'#1F7A4C' },
  riesgo:      { label:'KPI de Riesgo',    color:'#E17575', text:'#B03A33' }
};

/* ---------- Mini-chart SVG generators (previews) ---------- */
function svgLineBand(d){
  const values=d.values, targetY=d.targetY;
  const w=240,h=140,pad=18;
  const max=Math.max(...values,targetY)+4, min=Math.min(...values,targetY)-4;
  const plotW=w-pad*2, plotH=h-pad*2;
  const sY=v=>h-pad-((v-min)/(max-min))*plotH;
  const sX=i=>pad+(i/(values.length-1))*plotW;
  const pts=values.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const bandTop=sY(targetY+3), bandBot=sY(targetY-3);
  const dots=values.map((v,i)=>`<circle cx="${sX(i)}" cy="${sY(v)}" r="2.5" fill="#6A5AC4"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect x="${pad}" y="${bandTop}" width="${plotW}" height="${bandBot-bandTop}" fill="rgba(106,90,196,0.14)"/>
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="#6A5AC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}
function svgSparkCard(d){
  const values=d.values;
  const unit=d.unit||'';
  const w=240,h=140,pad=20;
  const max=Math.max(...values), min=Math.min(...values);
  const plotW=w-pad*2, plotH=h-pad*2-34;
  const sY=v=>(h-pad-34)-((v-min)/((max-min)||1))*plotH;
  const sX=i=>pad+(i/(values.length-1))*plotW;
  const pts=values.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const last=values[values.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <text x="${pad}" y="28" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="#14103B">${last}</text>
    <text x="${pad}" y="44" font-family="Inter, sans-serif" font-size="10" fill="rgba(20,16,59,0.5)">${unit}</text>
    <polyline points="${pts}" fill="none" stroke="#C0453D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${sX(values.length-1)}" cy="${sY(last)}" r="3" fill="#C0453D"/>
  </svg>`;
}
function svgFunnel(d){
  const stages=d.stages;
  const w=240,h=140,pad=12;
  const n=stages.length;
  const rowH=(h-pad*2)/n;
  const max=stages[0].value;
  let shapes='';
  stages.forEach((s,i)=>{
    const wTop=(stages[i].value/max)*(w-pad*2);
    const wBot=i<n-1?(stages[i+1].value/max)*(w-pad*2):wTop*0.82;
    const y=pad+i*rowH;
    const xTop=(w-wTop)/2, xBot=(w-wBot)/2;
    const color=i===0?'#6A5AC4':(i===n-1?'#C9A24B':`rgba(106,90,196,${(0.85-i*0.14).toFixed(2)})`);
    shapes+=`<polygon points="${xTop},${y} ${xTop+wTop},${y} ${xBot+wBot},${y+rowH-4} ${xBot},${y+rowH-4}" fill="${color}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${shapes}</svg>`;
}
function svgDualLine(d){
  const a=d.a, b=d.b;
  const w=240,h=140,pad=18;
  const all=[...a,...b];
  const max=Math.max(...all)+1, min=Math.min(...all)-1;
  const plotW=w-pad*2, plotH=h-pad*2;
  const sY=v=>h-pad-((v-min)/(max-min))*plotH;
  const sX=i=>pad+(i/(a.length-1))*plotW;
  const ptsA=a.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const ptsB=b.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <polyline points="${ptsB}" fill="none" stroke="rgba(20,16,59,0.4)" stroke-width="2" stroke-dasharray="4 3"/>
    <polyline points="${ptsA}" fill="none" stroke="#6A5AC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function svgStackedBars(d){
  const rows=d.rows;
  const w=240,h=140,pad=20;
  const n=rows.length;
  const gap=(w-pad*2)/n, barW=gap*0.55;
  const max=Math.max(...rows.map(r=>r.reduce((a,b)=>a+b,0)));
  const colors=['#6A5AC4','#C9A24B','rgba(20,16,59,0.28)'];
  let bars='';
  rows.forEach((r,i)=>{
    let y=h-pad;
    const x=pad+i*gap+(gap-barW)/2;
    r.forEach((seg,si)=>{
      const segH=(seg/max)*(h-pad*2);
      y-=segH;
      bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${segH}" fill="${colors[si%colors.length]}" rx="2"/>`;
    });
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)"/>
    ${bars}
  </svg>`;
}
function svgRankedBars(d){
  const values=d.values, threshold=d.threshold;
  const w=240,h=140,pad=20;
  const n=values.length;
  const rowH=(h-pad*2)/n;
  const max=Math.max(...values,threshold)+2;
  let bars='';
  values.forEach((v,i)=>{
    const y=pad+i*rowH+rowH*0.22;
    const bw=(v/max)*(w-pad*2-10);
    bars+=`<rect x="${pad}" y="${y}" width="${bw}" height="${rowH*0.56}" rx="3" fill="${i===0?'#C9A24B':'#6A5AC4'}"/>`;
  });
  const tx=pad+(threshold/max)*(w-pad*2-10);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${bars}
    <line x1="${tx}" y1="${pad-4}" x2="${tx}" y2="${h-pad+4}" stroke="#C0453D" stroke-width="2" stroke-dasharray="3 3"/>
  </svg>`;
}
function svgBullet(d){
  const value=d.value, target=d.target, max=d.max;
  const w=240,h=90,pad=18;
  const barY=h/2-11, barH=22;
  const sX=v=>pad+(v/max)*(w-pad*2);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect x="${pad}" y="${barY}" width="${w-pad*2}" height="${barH}" rx="4" fill="rgba(20,16,59,0.08)"/>
    <rect x="${pad}" y="${barY}" width="${sX(max*0.55)-pad}" height="${barH}" rx="4" fill="rgba(106,90,196,0.2)"/>
    <rect x="${pad}" y="${barY+5}" width="${sX(value)-pad}" height="${barH-10}" rx="3" fill="#6A5AC4"/>
    <line x1="${sX(target)}" y1="${barY-8}" x2="${sX(target)}" y2="${barY+barH+8}" stroke="#C9A24B" stroke-width="3"/>
  </svg>`;
}
function svgVariance(d){
  const items=d.items;
  const w=240,h=140,pad=20;
  const maxAbs=Math.max(...items.map(i=>Math.abs(i.value)));
  const midX=w/2;
  const rowH=(h-pad*2)/items.length;
  const scale=v=>(Math.abs(v)/maxAbs)*(w/2-pad-6);
  let bars='';
  items.forEach((it,i)=>{
    const y=pad+i*rowH+rowH*0.22;
    const bw=scale(it.value);
    const x=it.value>=0?midX:midX-bw;
    const color=it.value>=0?'#2F8F5B':'#C0453D';
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${rowH*0.56}" rx="2" fill="${color}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${midX}" y1="${pad-4}" x2="${midX}" y2="${h-pad+4}" stroke="rgba(20,16,59,0.3)" stroke-width="1.5"/>
    ${bars}
  </svg>`;
}
function svgBreakeven(d){
  const w=240,h=140,pad=20;
  const fixed=d.fixed, varRate=d.varRate, maxX=100;
  const sX=x=>pad+(x/maxX)*(w-pad*2);
  const costEnd=fixed+varRate*maxX;
  const maxY=Math.max(maxX,costEnd);
  const sY=y=>h-pad-(y/maxY)*(h-pad*2);
  const bx=fixed/(1-varRate);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${sX(0)}" y1="${h-pad}" x2="${sX(maxX)}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)"/>
    <line x1="${sX(0)}" y1="${sY(0)}" x2="${sX(maxX)}" y2="${sY(maxX)}" stroke="#6A5AC4" stroke-width="2.5"/>
    <line x1="${sX(0)}" y1="${sY(fixed)}" x2="${sX(maxX)}" y2="${sY(costEnd)}" stroke="#C0453D" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="${sX(bx)}" cy="${sY(bx)}" r="3.5" fill="#C9A24B"/>
  </svg>`;
}
function svgColumns(d){
  const values=d.values;
  const w=240,h=140,pad=20;
  const n=values.length;
  const gap=(w-pad*2)/n, barW=gap*0.55;
  const max=Math.max(...values);
  let bars='';
  values.forEach((v,i)=>{
    const bh=(v/max)*(h-pad*2);
    const x=pad+i*gap+(gap-barW)/2;
    const y=h-pad-bh;
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="2" fill="#6A5AC4"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)"/>
    ${bars}
  </svg>`;
}
function svgTwoBars(d){
  const w=240,h=140,pad=24;
  const max=Math.max(d.a,d.b)*1.2;
  const bw=50,gap=40;
  const startX=w/2-(bw*2+gap)/2;
  const hA=(d.a/max)*(h-pad*2), hB=(d.b/max)*(h-pad*2);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(20,16,59,0.25)"/>
    <rect x="${startX}" y="${h-pad-hA}" width="${bw}" height="${hA}" rx="3" fill="#8B7FD9"/>
    <rect x="${startX+bw+gap}" y="${h-pad-hB}" width="${bw}" height="${hB}" rx="3" fill="#6A5AC4"/>
  </svg>`;
}
function svgAreaLine(d){
  const values=d.values, minLine=d.minLine;
  const w=240,h=140,pad=18;
  const max=Math.max(...values,minLine)+8, min=Math.min(...values,minLine)-8;
  const plotW=w-pad*2, plotH=h-pad*2;
  const sY=v=>h-pad-((v-min)/(max-min))*plotH;
  const sX=i=>pad+(i/(values.length-1))*plotW;
  const pts=values.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const areaPts=`${sX(0)},${h-pad} ${pts} ${sX(values.length-1)},${h-pad}`;
  const minY=sY(minLine);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <polygon points="${areaPts}" fill="rgba(106,90,196,0.14)"/>
    <line x1="${pad}" y1="${minY}" x2="${w-pad}" y2="${minY}" stroke="#C0453D" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polyline points="${pts}" fill="none" stroke="#6A5AC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function svgDonut(d){
  const segments=d.segments;
  const w=240,h=140,cx=w/2,cy=h/2,r=48,circumference=2*Math.PI*r;
  const total=segments.reduce((a,s)=>a+s.value,0);
  let offset=0;
  const circles=segments.map(s=>{
    const frac=s.value/total;
    const dash=frac*circumference;
    const gap=circumference-dash;
    const c=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=dash;
    return c;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${circles}
    <circle cx="${cx}" cy="${cy}" r="${r-20}" fill="#FFFFFF"/>
  </svg>`;
}
/* ---------- Generadores de ejemplo ilustrado para fichas del catálogo (F3) ---------- */
function svgColumnsLabeled(d){
  const cats=d.categories, vals=d.values;
  const w=340,h=210,padL=20,padR=20,padT=24,padB=34;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const max=Math.max(...vals)*1.15;
  const n=cats.length, gap=plotW/n, barW=gap*0.5;
  let bars='';
  cats.forEach((c,i)=>{
    const bh=(vals[i]/max)*plotH;
    const x=padL+i*gap+(gap-barW)/2, y=padT+plotH-bh;
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" fill="#6A5AC4"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#14103B">${vals[i]}</text>
      <text x="${x+barW/2}" y="${padT+plotH+16}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="rgba(20,16,59,0.6)">${c}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" stroke="rgba(20,16,59,0.2)"/>${bars}</svg>`;
}
function svgHBarsLabeled(d){
  const cats=d.categories, vals=d.values;
  const w=340,h=210,padL=100,padR=30,padT=14,padB=14;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const n=cats.length, gap=plotH/n, barH=gap*0.5;
  const max=Math.max(...vals)*1.2;
  let bars='';
  cats.forEach((c,i)=>{
    const bw=(vals[i]/max)*plotW, y=padT+i*gap+(gap-barH)/2;
    bars+=`<text x="${padL-8}" y="${y+barH*0.7}" text-anchor="end" font-family="Inter, sans-serif" font-size="9.5" fill="rgba(20,16,59,0.65)">${c}</text>
      <rect x="${padL}" y="${y}" width="${bw}" height="${barH}" rx="3" fill="#6A5AC4"/>
      <text x="${padL+bw+6}" y="${y+barH*0.7}" font-family="IBM Plex Mono, monospace" font-size="10" fill="#14103B">${vals[i]}%</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}
function svgDotPlotLabeled(d){
  const cats=d.categories, vals=d.values;
  const w=340,h=210,padL=70,padR=30,padT=14,padB=14;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const n=cats.length, gap=plotH/n;
  const max=Math.max(...vals)*1.05, min=Math.min(...vals)*0.92;
  let items='';
  cats.forEach((c,i)=>{
    const y=padT+i*gap+gap/2, x=padL+((vals[i]-min)/(max-min))*plotW;
    items+=`<line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" stroke="rgba(20,16,59,0.08)"/>
      <text x="${padL-8}" y="${y+3}" text-anchor="end" font-family="Inter, sans-serif" font-size="9.5" fill="rgba(20,16,59,0.65)">${c}</text>
      <circle cx="${x}" cy="${y}" r="4.5" fill="#6A5AC4"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${items}</svg>`;
}
function svgLollipopLabeled(d){
  const cats=d.categories, vals=d.values;
  const w=340,h=210,padL=70,padR=30,padT=14,padB=14;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const n=cats.length, gap=plotH/n;
  const max=Math.max(...vals)*1.15;
  let items='';
  cats.forEach((c,i)=>{
    const y=padT+i*gap+gap/2, x=padL+(vals[i]/max)*plotW;
    items+=`<text x="${padL-8}" y="${y+3}" text-anchor="end" font-family="Inter, sans-serif" font-size="9.5" fill="rgba(20,16,59,0.65)">${c}</text>
      <line x1="${padL}" y1="${y}" x2="${x}" y2="${y}" stroke="#6A5AC4" stroke-width="2"/>
      <circle cx="${x}" cy="${y}" r="6" fill="#C9A24B"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${items}</svg>`;
}
function svgSlopeLabeled(d){
  const cats=d.categories, a=d.valuesA, b=d.valuesB;
  const w=340,h=210,padL=60,padR=60,padT=24,padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const all=[...a,...b];
  const max=Math.max(...all)*1.08, min=Math.min(...all)*0.9;
  const sY=v=>padT+plotH-((v-min)/(max-min))*plotH;
  let lines='';
  cats.forEach((c,i)=>{

      <circle cx="${padL}" cy="${y1}" r="3.5" fill="#6A5AC4"/><circle cx="${padL+plotW}" cy="${y2}" r="3.5" fill="#6A5AC4"/>
      <text x="${padL-6}" y="${y1+3}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" fill="#14103B">${a[i]}</text>
      <text x="${padL+plotW+6}" y="${y2+3}" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="9" fill="#14103B">${b[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <text x="${padL}" y="12" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="rgba(20,16,59,0.5)">Período 1</text>
    <text x="${padL+plotW}" y="12" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="rgba(20,16,59,0.5)">Período 2</text>${lines}</svg>`;
}
function svgDumbbellLabeled(d){
  const cats=d.categories, a=d.valuesA, b=d.valuesB;
  const w=340,h=210,padL=70,padR=30,padT=14,padB=14;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const n=cats.length, gap=plotH/n;
  const all=[...a,...b];
  const max=Math.max(...all)*1.1;

  cats.forEach((c,i)=>{

function svgLineEx(d){
  const vals=d.values, cats=d.categories;
  const w=340,h=210,padL=30,padR=20,padT=20,padB=30;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const max=Math.max(...vals)*1.1, min=Math.min(...vals)*0.9;
  const sY=v=>padT+plotH-((v-min)/(max-min))*plotH;
  const sX=i=>padL+(i/(vals.length-1))*plotW;
  const pts=vals.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const dots=vals.map((v,i)=>`<circle cx="${sX(i)}" cy="${sY(v)}" r="3" fill="#6A5AC4"/>`).join('');
  const labels=cats.map((c,i)=>`<text x="${sX(i)}" y="${padT+plotH+18}" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="rgba(20,16,59,0.55)">${c}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" stroke="rgba(20,16,59,0.2)"/>
    <polyline points="${pts}" fill="none" stroke="#6A5AC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

}
function svgAreaEx(d){
  const vals=d.values, minLine=d.minLine;
  const w=340,h=210,padL=30,padR=20,padT=20,padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const max=Math.max(...vals,minLine)*1.08, min=Math.min(...vals,minLine)*0.85;
  const sY=v=>padT+plotH-((v-min)/(max-min))*plotH;
  const sX=i=>padL+(i/(vals.length-1))*plotW;
  const pts=vals.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
  const areaPts=`${sX(0)},${padT+plotH} ${pts} ${sX(vals.length-1)},${padT+plotH}`;
  const minY=sY(minLine);

function svgSmallMultiplesEx(d){
  const series=d.series;
  const w=340,h=210,cols=3,rows=2;
  const cellW=w/cols, cellH=h/rows, pad=10;
  let cells='';
  series.forEach((s,idx)=>{
    const col=idx%cols, row=Math.floor(idx/cols);
    const ox=col*cellW, oy=row*cellH;
    const iw=cellW-pad*2, ih=cellH-pad*2-14;
    const vals=s.values;
    const max=Math.max(...vals)*1.1, min=Math.min(...vals)*0.9;
    const sY=v=>oy+14+ih-((v-min)/((max-min)||1))*ih;
    const sX=i=>ox+pad+(i/(vals.length-1))*iw;
    const pts=vals.map((v,i)=>`${sX(i)},${sY(v)}`).join(' ');
    const color=s.outlier?'#C0453D':'#6A5AC4';
    cells+=`<rect x="${ox+2}" y="${oy+2}" width="${cellW-4}" height="${cellH-4}" fill="none" stroke="rgba(20,16,59,0.1)" rx="4"/>
      <text x="${ox+pad}" y="${oy+11}" font-family="Inter, sans-serif" font-size="8.5" fill="rgba(20,16,59,0.6)">${s.label}</text>

  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${cells}</svg>`;
}
function svgStepLineEx(d){
  const vals=d.values, cats=d.categories;
  const w=340,h=210,padL=30,padR=20,padT=20,padB=30;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const max=Math.max(...vals)*1.15, min=Math.min(...vals)*0.85;
  const sY=v=>padT+plotH-((v-min)/(max-min))*plotH;
  const n=vals.length;
  const sX=i=>padL+(i/(n-1))*plotW;
  let path=`M ${sX(0)} ${sY(vals[0])}`;
  for(let i=1;i<n;i++){ path+=` L ${sX(i)} ${sY(vals[i-1])} L ${sX(i)} ${sY(vals[i])}`; }
  const labels=cats.map((c,i)=>`<text x="${sX(i)}" y="${padT+plotH+18}" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="rgba(20,16,59,0.55)">${c}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" stroke="rgba(20,16,59,0.2)"/>
    <path d="${path}" fill="none" stroke="#6A5AC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${labels}</svg>`;
}

function showChartPopup(evt,i){

          <div class="family-card-head"><h4>Composición</h4><span class="family-badge primaria">Primaria</span></div>
          <p><span class="fc-label">Patrón</span>De qué partes está hecho un total, y cuánto pesa cada una.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Qué canal explica nuestros ingresos digitales?" (E-commerce) · "¿Cómo se compone la cartera vencida por antigüedad?" (Cobranzas) · "¿Qué costos explican la caída del margen?" (Costos y Rentabilidad).</p>
          <div class="family-charts"><span class="chart-chip">Barras apiladas</span><span class="chart-chip">100% apiladas</span><span class="chart-chip">Waterfall</span><span class="chart-chip">Donut</span><span class="chart-chip">Treemap</span><span class="chart-chip">Marimekko</span></div>
          <p class="family-warn">Confusión frecuente: forzar una composición cuando las categorías en realidad no suman un total con sentido — eso es Comparación, no Composición.</p>
        </div>
        <div class="family-card primaria">
          <div class="family-card-head"><h4>Distribución</h4><span class="family-badge primaria">Primaria</span></div>
          <p><span class="fc-label">Patrón</span>Cómo se reparten los valores individuales de un conjunto — dónde se concentran, qué tan dispersos están, si hay atípicos.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Cómo se distribuye el tiempo de resolución de tickets?" (Servicio al Cliente) · "¿Qué tan dispersos están los salarios dentro de un mismo rol?" (RRHH) · "¿Hay outliers en el tiempo de entrega por ruta?" (Logística).</p>
          <div class="family-charts"><span class="chart-chip">Histograma</span><span class="chart-chip">Box plot</span><span class="chart-chip">Violin/density (avanzado)</span></div>
          <p class="family-warn">Confusión frecuente: reportar solo el promedio cuando la pregunta real es sobre dispersión — dos equipos con el mismo promedio pueden tener distribuciones completamente distintas.</p>
        </div>
        <div class="family-card primaria">
          <div class="family-card-head"><h4>Relación</h4><span class="family-badge primaria">Primaria</span></div>
          <p><span class="fc-label">Patrón</span>Si dos variables numéricas se mueven juntas, y con qué fuerza y dirección.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Existe relación entre el descuento otorgado y el tiempo de negociación?" (Ventas) · "¿El gasto en marketing se relaciona con los leads generados?" (Marketing) · "¿La antigüedad se relaciona con la productividad?" (Producción).</p>
          <div class="family-charts"><span class="chart-chip">Scatter plot</span><span class="chart-chip">Bubble chart</span><span class="chart-chip">Matriz de correlación (avanzado)</span></div>
          <p class="family-warn">Confusión frecuente: usar una línea de tiempo para mostrar relación entre dos variables no temporales — si ninguna de las dos es tiempo, no es Evolución, es Relación.</p>
        </div>
      </div>

      <h3>Las 9 familias aplicadas</h3>
      <div class="family-grid">
        <div class="family-card aplicada">
          <div class="family-card-head"><h4>Ranking</h4><span class="family-badge aplicada">Aplicada</span></div>
          <p class="family-derives">Deriva de Comparación + orden explícito</p>
          <p><span class="fc-label">Patrón</span>Quién está primero, quién último, dónde está el corte relevante (top 10, regla 80/20).</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Qué vendedores están sobre-cumpliendo?" (Ventas) · "¿Qué clientes concentran la cartera vencida?" (Cobranzas) · "¿Qué proveedores tienen el peor cumplimiento?" (Compras).</p>
          <div class="family-charts"><span class="chart-chip">Barras horizontales ordenadas</span><span class="chart-chip">Pareto</span><span class="chart-chip">Dot plot ordenado</span></div>
          <p class="family-warn">Señal de que la necesitas: si reordenaras las categorías alfabéticamente y el gráfico "perdería" su punto, es Ranking, no Comparación simple.</p>
        </div>
        <div class="family-card aplicada">
          <div class="family-card-head"><h4>Objetivo / Cumplimiento</h4><span class="family-badge aplicada">Aplicada</span></div>
          <p class="family-derives">Deriva de Comparación (valor vs. referencia)</p>
          <p><span class="fc-label">Patrón</span>Qué tan cerca está un valor real de una meta o referencia definida.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Cumplimos la meta de ingresos del trimestre?" (Ventas) · "¿El OTIF está dentro del compromiso?" (Logística) · "¿La cobertura de pagos críticos está sobre el mínimo?" (Tesorería).</p>
          <div class="family-charts"><span class="chart-chip">Bullet chart</span><span class="chart-chip">KPI card con meta</span><span class="chart-chip">Gauge (usar con cautela)</span></div>
          <p class="family-warn">Señal: hay UN valor y UNA referencia. Si son muchas categorías, cada una con su propia referencia, es Desviación/Variación, no esto.</p>
        </div>
        <div class="family-card aplicada">
          <div class="family-card-head"><h4>Desviación / Variación</h4><span class="family-badge aplicada">Aplicada</span></div>
          <p class="family-derives">Deriva de Objetivo/Cumplimiento, aplicado a muchas categorías</p>
          <p><span class="fc-label">Patrón</span>Cuánto y en qué dirección se desvió cada categoría de su propia referencia, todas a la vez.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Qué partidas del presupuesto se desviaron más?" (Finanzas) · "¿Qué insumos están encareciendo el costo total?" (Compras) · "¿Qué métricas del pitch se cumplieron y cuáles no?" (Inversionistas).</p>
          <div class="family-charts"><span class="chart-chip">Barras divergentes</span><span class="chart-chip">Waterfall</span></div>
          <p class="family-warn">Confusión frecuente: usar barras normales del mismo color, empezando en cero — sin el eje en cero al centro y el color por dirección, se pierde qué fue bien y qué fue mal.</p>
        </div>
        <div class="family-card aplicada">
          <div class="family-card-head"><h4>Flujo</h4><span class="family-badge aplicada">Aplicada</span></div>
          <p class="family-derives">Deriva de Evolución, aplicada a etapas discretas</p>
          <p><span class="fc-label">Patrón</span>Cómo se mueve un volumen a través de etapas secuenciales, y dónde se pierde en el camino.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿En qué etapa del embudo se pierde más pipeline?" (Ventas) · "¿Cómo se mueve el volumen de leads hasta convertirse en cliente?" (Marketing).</p>
          <div class="family-charts"><span class="chart-chip">Embudo (funnel)</span><span class="chart-chip">Sankey (especializado)</span></div>
          <p class="family-warn">Confusión frecuente: usar columnas apiladas cuando cada etapa es un subconjunto de la anterior, no categorías independientes — eso es exactamente lo que el embudo comunica mejor.</p>
        </div>
        <div class="family-card aplicada">
          <div class="family-card-head"><h4>Jerarquía</h4><span class="family-badge aplicada">Aplicada</span></div>
          <p class="family-derives">Deriva de Composición, con niveles anidados</p>
          <p><span class="fc-label">Patrón</span>Cómo se compone un total a través de más de un nivel de agrupación.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Cómo se distribuye el inventario por categoría y luego por SKU?" (Inventario) · "¿Qué departamentos y qué roles concentran el bus factor?" (TI).</p>
          <div class="family-charts"><span class="chart-chip">Treemap</span><span class="chart-chip">Sunburst (situacional)</span></div>
          <p class="family-warn">Confusión frecuente: usarla cuando solo hay un nivel de categorías — ahí un treemap es una composición simple con pasos extra innecesarios.</p>
        </div>
        <div class="family-card aplicada">
          <div class="family-card-head"><h4>Geografía</h4><span class="family-badge aplicada">Aplicada</span></div>
          <p class="family-derives">Deriva de Comparación/Composición, con referencia espacial</p>
          <p><span class="fc-label">Patrón</span>Cómo varía una medida según la ubicación.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Qué región concentra más costo logístico?" (Logística) · "¿Dónde está la mayor concentración de clientes en mora?" (Cobranzas).</p>
          <div class="family-charts"><span class="chart-chip">Mapa coroplético</span><span class="chart-chip">Mapa de burbujas</span><span class="chart-chip">Mapa de calor geográfico</span></div>
          <p class="family-warn">Confusión frecuente: usar mapa solo porque hay una columna de región — si una tabla ordenada comunica lo mismo sin perder nada, no necesitabas el mapa.</p>
        </div>
        <div class="family-card aplicada">
          <div class="family-card-head"><h4>Riesgo</h4><span class="family-badge aplicada">Aplicada</span></div>
          <p class="family-derives">Deriva de Relación (probabilidad × impacto)</p>
          <p><span class="fc-label">Patrón</span>Dónde se concentra la exposición combinando qué tan probable es un evento y qué tan grave sería.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Qué proveedores críticos tienen mayor riesgo financiero?" (Proveedores) · "¿Dónde se concentra el riesgo de rotación?" (RRHH) · "¿Qué litigios tienen mayor exposición?" (Legal).</p>
          <div class="family-charts"><span class="chart-chip">Matriz de riesgo</span><span class="chart-chip">Heatmap de concentración</span></div>
          <p class="family-warn">Confusión frecuente: listar riesgos en tabla plana sin cruzarlos en la grilla — así es fácil sobre-reaccionar a algo probable pero leve y subestimar algo raro pero catastrófico.</p>
        </div>
        <div class="family-card aplicada">
          <div class="family-card-head"><h4>Control / Calidad</h4><span class="family-badge aplicada">Aplicada</span></div>
          <p class="family-derives">Deriva de Evolución + banda estadística</p>
          <p><span class="fc-label">Patrón</span>Si un proceso se mantiene dentro de un rango de variación normal, o si hay una señal real de cambio.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿La tasa de defectos está dentro del rango de control, o hay una señal de proceso fuera de control?" (Producción).</p>
          <div class="family-charts"><span class="chart-chip">Control chart</span><span class="chart-chip">Pareto (causas)</span></div>
          <p class="family-warn">Confusión frecuente: reaccionar a cada punto que sube o baja en una línea simple como si fuera una señal, sin bandas que digan qué variación es "normal".</p>
        </div>
        <div class="family-card aplicada">
          <div class="family-card-head"><h4>Pronóstico / Incertidumbre</h4><span class="family-badge aplicada">Aplicada</span></div>
          <p class="family-derives">Deriva de Evolución proyectada + banda de distribución</p>
          <p><span class="fc-label">Patrón</span>Hacia dónde va una medida en el futuro, y qué tan seguros estamos de esa proyección.</p>
          <p><span class="fc-label">Pregunta típica</span>"¿Cuál es la proyección de caja a 13 semanas?" (Tesorería) · "¿Qué tan preciso ha sido nuestro forecast de demanda?" (Inventario).</p>
          <div class="family-charts"><span class="chart-chip">Forecast con banda de confianza</span><span class="chart-chip">Escenarios (líneas múltiples)</span></div>
          <p class="family-warn">Confusión frecuente: mostrar el forecast tan sólido como el dato real — sin diferenciarlos visualmente, el lector no distingue "lo que pasó" de "lo que creemos que pasará".</p>
        </div>
      </div>

      <h3>Un mismo gráfico puede pertenecer a más de una familia</h3>
      <p>El Waterfall aparece en Composición y en Desviación/Variación — el mismo gráfico, según si muestras "de qué se compone un total" o "qué explica una variación contra un punto de partida". El Pareto aparece en Ranking y en Control/Calidad — mismo gráfico, distinta pregunta: ¿quién es el top? contra ¿qué causas concentran la mayoría de las no conformidades? El Treemap aparece en Composición y en Jerarquía — la diferencia es si hay uno o más niveles de agrupación.</p>
      <p>Esto no es una inconsistencia del catálogo: es la prueba de que la familia de un gráfico la determina la <strong>pregunta</strong> que le estás haciendo, no una propiedad fija de su forma visual. En el catálogo (bloque F3), cada ficha indicará su familia principal y, cuando aplique, sus familias secundarias.</p>

let activeId = 'direccion';

function tabItemHTML(a, numDisplay){
  return `<li class="tab-item ${a.ready?'':'pending'} ${a.id===activeId?'active':''}" onclick="selectArea('${a.id}')">
    <span class="n">${numDisplay}</span>
    <span class="dot"></span>
    <span class="name">${a.name}</span>
  </li>`;
}
function renderSidebar(filter=''){
  const f = filter.trim().toLowerCase();
  document.getElementById('tabListFundamentos').innerHTML = fundamentosData
    .filter(a => a.name.toLowerCase().includes(f))
    .map(a => tabItemHTML(a, a.num)).join('');
  document.getElementById('tabListAreas').innerHTML = areasData
    .filter(a => a.name.toLowerCase().includes(f))
    .map(a => tabItemHTML(a, String(a.num).padStart(2,'0'))).join('');

  const total = fundamentosData.length + areasData.length;
  const done = fundamentosData.filter(a=>a.ready).length + areasData.filter(a=>a.ready).length;
  document.getElementById('progressText').textContent = `${done} de ${total} bloques completos`;
  document.getElementById('progressPct').textContent = Math.round(done/total*100)+'%';
  document.getElementById('progressFill').style.width = Math.round(done/total*100)+'%';
}

function kpiCardHTML(k){
  const t = KPI_TYPES[k.type];
  return `<article class="kpi-card" style="--kc:${t.color}; --kct:${t.text}">
    <div class="kpi-card__head">
      <span class="kpi-tag">${t.label}</span>
      <h4>${k.name}</h4>
    </div>
    <p class="kpi-card__def">${k.definicion}</p>
    <div class="kpi-meta-row">
      <div class="kpi-meta"><span>Unidad</span><strong>${k.unidad}</strong></div>
      <div class="kpi-meta"><span>Frecuencia</span><strong>${k.frecuencia}</strong></div>
      <div class="kpi-meta"><span>Objetivo</span><strong>${k.objetivo}</strong></div>
      <div class="kpi-meta"><span>Benchmark</span><strong>${k.benchmark}</strong></div>
    </div>
    <div class="kpi-formula"><span>Fórmula</span><code>${k.formula}</code></div>
    <p class="kpi-interp"><span>Interpretación — </span>${k.interpretacion}</p>
    <div class="kpi-updown">
      <div class="up"><span>↑ Si sube</span><p>${k.siSube}</p></div>
      <div class="down"><span>↓ Si baja</span><p>${k.siBaja}</p></div>
    </div>
    <p class="kpi-decision"><span>Decisión que habilita — </span>${k.decision}</p>
    <div class="kpi-tags">
      <div><span>Datos necesarios</span><p>${k.datos}</p></div>

    <div class="kpi-trap">⚠ <strong>Trampa:</strong> ${k.trampa}</div>
  </article>`;
}

        </div>

        <div class="case-divider">Solución razonada</div>

        <p class="solved-note">Con los datos de ${d.case.company.name} para este trimestre:</p>
        <div class="example-data"><h5>Datos</h5><ul>${d.solved.datos.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div class="flow-chain">
          <span>Datos</span><span>→</span><span>KPI</span><span>→</span><span>Comparación</span><span>→</span><span>Análisis</span><span>→</span><span>Gráfico</span><span>→</span><span>Insight</span><span>→</span><span>Decisión</span>
        </div>
        <div class="example-block"><h5>→ KPI</h5><ul>${d.solved.kpiCalcs.map(x=>`<li><strong>${x.label}</strong> = ${x.calc} = <span class="result">${x.result}</span></li>`).join('')}</ul></div>
        <div class="example-block"><h5>→ Comparación</h5><p>${d.solved.comparacion}</p></div>
        <div class="example-block"><h5>→ Análisis</h5><p>${d.solved.analisis}</p></div>
        <div class="example-block"><h5>→ Gráfico</h5><p>${d.solved.grafico}</p></div>
        <div class="example-block insight"><h5>→ Insight</h5><p>${d.solved.insight}</p></div>
        <div class="example-block decision"><h5>→ Decisión</h5><p>${d.solved.decision}</p></div>
      </div>
    </details>
  `;
}

const IMPORTANCE_META = {
  fundamental:{ label:'Fundamental', color:'#8A6A1F', bg:'rgba(201,162,75,0.15)' },
  importante:{ label:'Importante', color:'#4A3F94', bg:'rgba(106,90,196,0.12)' },
  especializado:{ label:'Especializado', color:'#2E6E92', bg:'rgba(111,177,217,0.15)' },
  avanzado:{ label:'Avanzado', color:'#5B4FA8', bg:'rgba(139,127,217,0.15)' },
  raro:{ label:'Raro / situacional', color:'rgba(20,16,59,0.55)', bg:'rgba(20,16,59,0.06)' }
};
const RISK_META = {
  bajo:{ label:'Riesgo bajo', color:'#1F7A4C', bg:'rgba(47,143,91,0.12)' },
  medio:{ label:'Riesgo medio', color:'#8A6A1F', bg:'rgba(201,162,75,0.15)' },
  alto:{ label:'Riesgo alto', color:'#B03A33', bg:'rgba(192,69,61,0.1)' }
};
const AREA_LEVEL_META = {
  generalmente:'Aplica generalmente', industria:'Industria específica', especifico:'Industria específica',
  especializado:'Especializado', no:'No suele ser necesario'
};

function pendingPanelHTML(name){
  return `<div class="pending-panel">
    <span class="pending-icon">○</span>
    <h2>${name}</h2>
    <p>Este bloque todavía no está desarrollado. Se agrega en una próxima sesión, siguiendo la cadencia acordada.</p>
  </div>`;
}
function fichaHTML(f){
  const imp = IMPORTANCE_META[f.importancia];
  const rie = RISK_META[f.riesgo];
  return `<article class="chart-ficha">
    <div class="ficha-head">
      <div>
        <span class="ficha-familia">${f.familia}${f.familiaSecundaria?` · también en ${f.familiaSecundaria}`:''}</span>
        <h3>${f.nombreEs} <span class="ficha-en">(${f.nombreEn})</span></h3>
      </div>
      <div class="ficha-badges">
        <span class="ficha-badge" style="background:${imp.bg}; color:${imp.color}">${imp.label}</span>
        <span class="ficha-badge" style="background:rgba(20,16,59,0.06); color:var(--text-2)">Nivel: ${f.dificultad}</span>
        <span class="ficha-badge" style="background:${rie.bg}; color:${rie.color}">${rie.label}</span>
      </div>
    </div>
    <div class="ficha-question"><span>Pregunta que responde</span>${f.pregunta}</div>
    <div class="ficha-example">
      ${buildFichaExample(f.ejemplo)}
      <span class="ficha-example-caption">Ejemplo ilustrativo — datos ficticios con fines didácticos</span>
    </div>
    <p class="ficha-patron"><strong>Patrón que hace visible — </strong>${f.patron}</p>

    <div class="ficha-block">
      <h5>Estructura de datos</h5>
      <div class="table-scroll"><table class="tbl"><thead><tr>${f.estructuraDatos.columnas.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody><tr>${f.estructuraDatos.ejemplo.map(v=>`<td>${v}</td>`).join('')}</tr></tbody></table></div>
    </div>

    <div class="ficha-block">
      <h5>Variables</h5>
      <div class="ficha-vars">${f.variables.map(v=>`<div><span>${v.label}</span><p>${v.value}</p></div>`).join('')}</div>
    </div>

    <div class="kpi-updown">
      <div class="up"><span>✓ Cuándo usarlo</span><p>${f.cuandoSi.join(' · ')}</p></div>
      <div class="down"><span>✕ Cuándo NO usarlo</span><p>${f.cuandoNo.join(' · ')}</p></div>
    </div>
    <div class="kpi-updown">
      <div class="up"><span>Ventajas</span><p>${f.ventajas.join(' · ')}</p></div>
      <div class="down"><span>Limitaciones</span><p>${f.limitaciones.join(' · ')}</p></div>
    </div>

    <div class="ficha-errors"><h5>Errores frecuentes</h5><ul>${f.errores.map(e=>`<li>${e}</li>`).join('')}</ul></div>

    <div class="ficha-block"><h5>Alternativas y por qué elegir este</h5><p style="font-size:0.86rem; color:var(--text-2); line-height:1.6; margin:0;">${f.alternativas}</p></div>

    <div class="ficha-block"><h5>KPI compatibles</h5><div class="family-charts">${f.kpiCompatibles.map(k=>`<span class="chart-chip">${k}</span>`).join('')}</div></div>

    <div class="ficha-block">
      <h5>Áreas empresariales</h5>
      <div class="table-scroll"><table class="tbl"><tbody>
        ${f.areas.map(a=>`<tr><td>${a.area}</td><td>${AREA_LEVEL_META[a.nivel]}</td><td>${a.nota||''}</td></tr>`).join('')}
      </tbody></table></div>
    </div>

    <div class="example-block insight"><h5>→ Insight</h5><p>${f.insight}</p></div>
    <div class="example-block decision"><h5>→ Decisión</h5><p>${f.decision}</p></div>

    <div class="ficha-block">
      <h5>Cómo construirlo en Excel</h5>
      <div class="table-scroll"><table class="tbl"><tbody>
        ${f.excel.map(e=>`<tr><td>${e.label}</td><td>${e.value}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
  </article>`;
}
function renderCatalogo(item){
  if(!item.ready) return pendingPanelHTML(item.name);
  return `
    <div class="area-eyebrow">FUNDAMENTOS · ${item.num}</div>
    <h1 class="area-title">${item.name}</h1>
    <p class="area-mission">${item.intro}</p>
    ${item.fichas.map(fichaHTML).join('')}
  `;
}
function renderFundamento(item){
  if(!item.ready) return pendingPanelHTML(item.name);
  return `
    <div class="area-eyebrow">FUNDAMENTOS · ${item.num}</div>
    <h1 class="area-title">${item.name}</h1>
    ${item.html}
  `;
}
function selectArea(id){
  const item = fundamentosData.find(a=>a.id===id) || areasData.find(a=>a.id===id);
  if(!item) return;
  activeId = id;
  hideChartPopup();
  let html;
  if(item.data) html = renderArea(item);
  else if(item.fichas) html = renderCatalogo(item);
  else html = renderFundamento(item);
  document.getElementById('main').innerHTML = html;
  renderSidebar(document.getElementById('searchInput').value);
  window.scrollTo(0,0);
}

function toggleAll(open){
  document.querySelectorAll('#main details').forEach(d=>d.open=open);
}

renderSidebar();
selectArea('metodologia');
</script>
</body>
</html>
